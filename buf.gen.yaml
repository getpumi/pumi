# The code generation of the api module (decision 0090). Each plugin is a tool
# pinned in tools/ and run with go tool, so generation uses neither the Buf
# Schema Registry nor remote plugins. make generate runs it.

version: v2

clean: true

managed:
  enabled: true
  # The Go package of every schema follows from its directory, including a
  # schema kept unchanged from another project with its own go_package.
  override:
    - file_option: go_package_prefix
      value: getpumi.dev/pumi/api/gen

plugins:
  - local: ["go", "tool", "-modfile=tools/protoc-gen-go.mod", "protoc-gen-go"]
    out: api/gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/protoc-gen-connect-go.mod", "protoc-gen-connect-go"]
    out: api/gen
    opt: paths=source_relative
  # One self-contained JSON Schema 2020-12 for each top-level message, with
  # the JSON field names that protojson writes, for harnesses that take JSON
  # Schema (decision 0160). The plain variant accepts what protojson writes,
  # such as int64 values as strings; the strict variant does not.
  - local: ["go", "tool", "-modfile=tools/protoc-gen-jsonschema.mod", "protoc-gen-jsonschema"]
    out: api/gen/jsonschema
    opt: target=json-bundle
