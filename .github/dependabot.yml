# Dependabot updates the pins it supports (decision 0115): the SHAs of the
# GitHub Actions, the go.mod files of the core, api and conformance modules
# and the golang and rust base images of the devcontainer. make pins, run by
# the weekly pins workflow, reports the other pins. Each update is a pull
# request of its own (decision 0116).

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /
      - /api
      - /conformance
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
