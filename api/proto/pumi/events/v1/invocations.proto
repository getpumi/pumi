syntax = "proto3";

package pumi.events.v1;

import "pumi/events/v1/basis.proto";
import "pumi/harness/v1/harness.proto";

// InvocationRequested is the data of dev.getpumi.invocation.requested: the
// kernel's intent to invoke a harness.
message InvocationRequested {
  // The invocation.
  string invocation = 1;
  // The idempotency key.
  string idempotency_key = 2;
  // The hash of the invocation document: sha256: and the hex SHA-256 of
  // document.
  string document_hash = 3;
  // The invocation document, as the binary protobuf of
  // pumi.runner.v1.Invocation, which Claim returns to the runner that
  // claims the invocation (decision 0165). It is bytes, not the message,
  // because the runner protocol is versioned apart from the event schema
  // (decision 0041) and pumi.runner.v1 imports this file.
  bytes document = 4;
  // The plan that the invocation is for, which the kernel names, so that
  // the usage and the planning output of an invocation are found for its
  // plan and a plan cancel reaches the plan's invocations (decision 0175).
  string plan = 5;
}

// InvocationStarted is the data of dev.getpumi.invocation.started: the
// runner's intent to run the invocation.
message InvocationStarted {
  // The invocation.
  string invocation = 1;
  // The runner.
  string runner = 2;
  // The number of the lease the runner holds (decision 0035).
  int64 lease_number = 3;
}

// InvocationResult is the data of dev.getpumi.invocation.result: what the
// invocation produced.
message InvocationResult {
  // OutputFile is one output file, stored as a blob.
  message OutputFile {
    // The path of the file.
    string path = 1;
    // The hash of the blob that holds it.
    string blob_hash = 2;
  }

  // Usage is the usage summary of the invocation.
  message Usage {
    // The tokens used.
    int64 tokens = 1;
    // The cost in microdollars (decision 0136).
    int64 cost_microdollars = 2;
    // The seconds the invocation ran.
    int64 seconds = 3;
  }

  // The invocation.
  string invocation = 1;
  // The output files.
  repeated OutputFile output_files = 2;
  // The hash of the blob that holds the full log (decision 0034).
  string log_blob_hash = 3;
  // The usage summary.
  Usage usage = 4;
  // The tree that the runner computed from the workspace after the adapter
  // exited; empty when the invocation changes no code (decisions 0160 and
  // 0162).
  string tree = 5;
  // The structured output, as the protojson of the message that the
  // invocation document names, as the runner parsed it (decisions 0160 and
  // 0162).
  string output = 6;
  // The refusals that the harness reported, from the adapter's result
  // (decision 0249).
  repeated pumi.harness.v1.Refusal refusals = 7;
}

// InvocationFinished is the data of dev.getpumi.invocation.finished: the
// confirmation that the invocation ended.
message InvocationFinished {
  // Outcome is how the invocation ended.
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_SUCCEEDED = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_CANCELLED = 3;
    OUTCOME_CAP_REACHED = 4;
    OUTCOME_RESOLVED_ON_RECOVERY = 5;
  }

  // The invocation.
  string invocation = 1;
  // The outcome.
  Outcome outcome = 2;
}

// CancelRequested is the data of dev.getpumi.cancel.requested (decisions
// 0035 and 0170). With a plan and no invocation it cancels the plan; with an
// invocation it cancels that invocation.
message CancelRequested {
  // The invocation to cancel.
  string invocation = 1;
  // Who asked for the cancellation.
  string requested_by = 2;
  // The facts behind the request.
  Basis basis = 3;
  // The plan to cancel, when the request names no invocation, or the plan of
  // the invocation.
  string plan = 4;
}
