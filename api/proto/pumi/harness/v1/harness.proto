syntax = "proto3";

// The messages between the runner and a harness adapter (decisions 0152 and
// 0158 to 0160). There is no service: the runner starts the adapter as one
// process per invocation, writes an Invocation as one line of protojson to
// its standard input, and reads the adapter's standard output as lines,
// each the protojson of a Line: a usage figure, which the adapter may pass
// at any time while the run goes on, or the result, which is the last line
// (decisions 0241 and 0252). Standard error is the log. The runner closes
// standard input to ask the adapter to stop.
package pumi.harness.v1;

// Invocation is what the runner gives a harness adapter. The runner derives
// it from the invocation document (pumi.runner.v1.Invocation, decision
// 0024): it leaves out what only the runner needs, which is the credential
// handles, the image digest and the isolation level, and adds what it has
// resolved, which is the workspace, the model gateway or, on the sign-in
// path, the models, and the output schema (decisions 0158 and 0254). An
// agent run whose adapter is in the API key mode always has the model
// gateway (decision 0226); one whose adapter is in the sign-in mode has none,
// because its harness talks to the provider directly (decision 0240). An
// adapter never receives a credential handle or a provider key.
message Invocation {
  // The invocation.
  string invocation = 1;
  // The idempotency key.
  string idempotency_key = 2;
  // The component that the invocation runs.
  Component component = 3;
  // The input: the repository and tree that the workspace holds, and the
  // task.
  Input input = 4;
  // The role.
  Role role = 5;
  // What the run may do. The adapter translates the list into its harness's
  // own settings; the runner checks the workspace after the run (decision
  // 0159).
  Capabilities capabilities = 6;
  // The budget. The model gateway's caps enforce its tokens and cost, or on
  // the sign-in path the runner's count of the usage figures that the
  // adapter passes, and the runner enforces its seconds; the adapter can
  // also pass it to its harness (decisions 0193, 0228 and 0241).
  Usage budget = 7;
  // The absolute path of the workspace, a checkout of the input tree, in
  // which the runner started the adapter.
  string workspace = 8;
  // The model gateway, through which every model call of an adapter in the
  // API key mode goes (decision 0036). Such an agent run always has it; the
  // runner refuses one without it (decision 0226). An agent run of an
  // adapter in the sign-in mode, a check and an external action have none
  // (decision 0240).
  Gateway gateway = 9;
  // The schema of the structured output.
  OutputSchema output_schema = 10;
  // The model role of an agent run, such as "frontier". Through the model
  // gateway, the adapter asks its harness for the role by name, as the model
  // of its calls, and the gateway sends each call to the model that the
  // configuration maps the role to (decision 0233).
  string model_role = 11;
  // On the sign-in path, the model that the configuration maps the model
  // role to, which the adapter asks its harness for (decisions 0241 and
  // 0254). Empty when the agent run has the model gateway, and for a check
  // or an external action.
  string model = 12;
  // On the sign-in path, the model of the role's fallback when the fallback
  // is on the same adapter, which the adapter gives its harness as the
  // fallback within the run; empty otherwise (decisions 0241, 0246 and 0254).
  string fallback_model = 13;
  // The read paths of the adapter's configuration: absolute paths outside
  // the workspace that the harness's commands may read, such as a toolchain
  // or a module cache. An adapter whose harness runs commands in a sandbox
  // lets the sandbox read them, never write them, and gives the commands a
  // writable cache of the invocation's own (decision 0269).
  repeated string read_paths = 14;
}

// Component is the component that an invocation runs, with its name and
// version (decision 0024).
message Component {
  // Kind is the kind of component.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A check, such as a test run.
    KIND_CHECK = 1;
    // An external action, such as the forge adapter's merge.
    KIND_EXTERNAL_ACTION = 2;
    // An agent run.
    KIND_AGENT_RUN = 3;
  }

  // The kind.
  Kind kind = 1;
  // The name.
  string name = 2;
  // The version.
  string version = 3;
}

// Input is the input of an invocation (decision 0024).
message Input {
  // The repository.
  string repo = 1;
  // The tree hash.
  string tree = 2;
  // The task, such as the prompt of an agent run.
  string task = 3;
}

// Role is the role an invocation runs in. Only the gate role may write
// verdicts, and gate work and agent work run under separate runner
// identities (decisions 0024 and 0156).
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Gate work, which may report verdicts and warnings.
  ROLE_GATE = 1;
  // Agent work.
  ROLE_AGENT = 2;
}

// Capabilities is the capability list of an invocation (decision 0159),
// neutral between harnesses. What the list leaves out, the run may not do.
message Capabilities {
  // Network is the network access of a run.
  message Network {
    // Access is a kind of network access.
    enum Access {
      // Treated as ACCESS_NONE.
      ACCESS_UNSPECIFIED = 0;
      // No network access.
      ACCESS_NONE = 1;
      // The model gateway only, or on the sign-in path, where the harness
      // talks to the provider directly, the provider only (decision 0240).
      ACCESS_GATEWAY = 2;
      // The model gateway, or on the sign-in path the provider, and the
      // hosts listed.
      ACCESS_HOSTS = 3;
    }

    // The access.
    Access access = 1;
    // The hosts, when the access is ACCESS_HOSTS.
    repeated string hosts = 2;
  }

  // ToolKind is a kind of tool.
  enum ToolKind {
    TOOL_KIND_UNSPECIFIED = 0;
    // Reading files.
    TOOL_KIND_READ = 1;
    // Editing files.
    TOOL_KIND_EDIT = 2;
    // Running commands.
    TOOL_KIND_RUN_COMMANDS = 3;
    // Using the web.
    TOOL_KIND_WEB = 4;
  }

  // The paths the run may write, as globs relative to the workspace. A file
  // written outside them fails the invocation.
  repeated string write_paths = 1;
  // The commands the run may run, as prefixes such as "go test". An entry
  // may begin with one or more NAME=value assignments, such as
  // "GOWORK=off go test", and then allows that command with exactly those
  // assignments: the entry "go test" does not allow "GOWORK=off go test",
  // and no entry allows an assignment it does not name. Each adapter
  // translates an entry as written (decision 0248).
  repeated string commands = 2;
  // The network access.
  Network network = 3;
  // The kinds of tool the run may use.
  repeated ToolKind tools = 4;
}

// Usage is an amount of usage: of a budget, or what a run used (decision
// 0136).
message Usage {
  // The tokens.
  int64 tokens = 1;
  // The cost in microdollars.
  int64 cost_microdollars = 2;
  // The wall time in seconds.
  int64 seconds = 3;
}

// Gateway is how the adapter reaches the model gateway (decision 0036).
message Gateway {
  // The base URL.
  string base_url = 1;
  // The short-lived token, valid for this invocation only. The runner masks
  // it in the log.
  string token = 2;
  // Whether the harness keeps its own sign-in, such as a Claude
  // subscription. When it does, the gateway forwards the harness's own
  // credential, and the harness sends the token in the header X-Pumi-Token
  // on every call. When it does not, the gateway holds the provider's API
  // key, and the harness sends the token as its API key (decision 0225).
  bool keeps_sign_in = 3;
}

// OutputSchema is the schema of an invocation's structured output (decision
// 0160).
message OutputSchema {
  // The full name of the protobuf message in the api module, such as
  // pumi.events.v1.VerdictRecorded. The runner parses the output into it
  // with protojson, and an unknown field fails the invocation.
  string message = 1;
  // The JSON Schema generated from the message by make generate, for
  // harnesses that take JSON Schema.
  string json_schema = 2;
}

// Result is what a harness adapter writes to its standard output when it
// exits (decisions 0158 and 0160). Exit status 0 means a result was
// written. A non-zero exit status, a missing result or a result that does
// not parse fails the invocation.
message Result {
  // Status is how the run ended.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The run completed.
    STATUS_COMPLETED = 1;
    // The run failed.
    STATUS_FAILED = 2;
    // The run stopped because the runner closed standard input. The result
    // holds what the run had.
    STATUS_STOPPED = 3;
    // The provider's usage or rate limit stopped the run. The adapter
    // turns off any setting of its harness that would wait out a limit
    // instead of stopping (decision 0249).
    STATUS_LIMITED = 4;
  }

  // The status.
  Status status = 1;
  // The structured output, as JSON of the message named in the invocation's
  // output schema.
  string output = 2;
  // The paths of the output files, relative to the workspace. The runner
  // uploads them to the blob store and records them by hash (decision
  // 0033).
  repeated string output_files = 3;
  // The adapter's own usage figures, for information only. The runner
  // writes them to the invocation's log; the usage of invocation.result is
  // the model gateway's totals with the wall time the runner measured
  // (decision 0230).
  Usage usage = 4;
  // The refusals that the harness reported: what the run asked to do that
  // its settings refused. The runner puts them in invocation.result, and
  // the question of an escalation names them. An adapter reports what its
  // harness tells it, so a harness that reports no refusals gives none
  // (decision 0249).
  repeated Refusal refusals = 5;
}

// Refusal is one thing that the run asked to do and its harness refused
// (decision 0249).
message Refusal {
  // The kind of tool that asked.
  Capabilities.ToolKind tool = 1;
  // What was asked.
  oneof asked {
    // The path, relative to the workspace or absolute, that the run asked
    // to read or write.
    string path = 2;
    // The command that the run asked to run, as the harness reported it.
    string command = 3;
    // The host that the run asked to reach.
    string host = 4;
  }
}

// Line is one line of the adapter's standard output (decisions 0241 and
// 0252). The adapter may write any number of usage figures, each as soon as
// its harness reports it, and then exactly one result, which is the last
// line. A line that does not parse, a line with neither, a line after the
// result and a missing result fail the invocation.
message Line {
  // What the line holds.
  oneof kind {
    // The usage of one model call, or of one turn for a harness that
    // reports usage per turn, as the harness reported it.
    UsageFigure usage = 1;
    // The result.
    Result result = 2;
  }
}

// UsageFigure is the usage that the harness reported for one model call,
// or for one turn, with every kind of token that the list-price table
// prices (decisions 0239 and 0241). On the sign-in path the runner counts
// these figures; on the gateway path it writes them to the invocation's
// log, and the gateway's count is the one that counts (decision 0230).
message UsageFigure {
  // The model that answered, as the harness reported it.
  string model = 1;
  // The input tokens that were not read from or written to the prompt
  // cache.
  int64 input_tokens = 2;
  // The tokens written to the 5-minute cache. A cache write that the
  // harness does not split by duration is a 5-minute write.
  int64 five_minute_cache_write_tokens = 3;
  // The tokens written to the 1-hour cache.
  int64 one_hour_cache_write_tokens = 4;
  // The tokens read from the cache.
  int64 cache_read_tokens = 5;
  // The output tokens, thinking and reasoning included.
  int64 output_tokens = 6;
  // The number of web searches that the call made.
  int64 web_searches = 7;
  // The speed of the call as the provider reported it, such as "fast";
  // empty when not reported.
  string speed = 8;
  // The inference geography of the call as the provider reported it, such
  // as "us"; empty when not reported.
  string inference_geo = 9;
}
