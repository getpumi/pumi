# The weekly pin report (decision 0115). It runs make pins in the
# devcontainer image by digest, as the CI jobs do (decisions 0089 and 0113),
# and fails when a pin is out of date. The workflow only sets up and calls
# make (decision 0084).
#
# GitHub sends the notice of a failed scheduled run to the user who last
# changed the cron line, and turns off the schedule of a public repository
# after 60 days without activity.

name: Pins

on:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the GitHub container registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Find or build the image
        id: image
        run: |
          image=$(make --no-print-directory image)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"

  pins:
    name: pins
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - *checkout
      - run: make pins
