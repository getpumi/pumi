syntax = "proto3";

package pumi.workflow.v1;

import "pumi/facts/v1/code.proto";

// PlanningOutput is the structured output of the planning stage of the first
// workflow (decision 0171): the plan, the paths it will change, and any open
// questions, each with the agent's own answer. The questions.open fact is
// projected from it.
message PlanningOutput {
  // Question is one open question.
  message Question {
    // The id of the question, unique in the output, by which the second
    // opinion answers it.
    string id = 1;
    // The question.
    string text = 2;
    // The agent's own answer.
    string agent_answer = 3;
  }

  // NoTest is one requirement of the plan's change that the plan gives no
  // test, with the reason (decision 0295).
  message NoTest {
    // The requirement's ID, such as BLS-001 (decision 0274).
    string requirement_id = 1;
    // Why the requirement has no test, and how it is verified instead.
    string reason = 2;
  }

  // The plan, as Markdown.
  string plan = 1;
  // The paths the plan will change, as patterns relative to the root of the
  // repository. The scope gate reads the changed paths outside them
  // (paths.outside, decision 0136).
  repeated string declared_paths = 2;
  // The open questions. With none, the plan goes to plan review; with any,
  // to a second opinion.
  repeated Question questions = 3;
  // The requirements that the plan gives no test, each with the reason.
  // The kernel adds the reasons to the coverage report before the
  // conformance audit, which judges each of them (decision 0295).
  repeated NoTest no_test = 4;
}

// SecondOpinion is the structured output of the second opinion stage of the
// first workflow (decision 0171): an independent answer to each open
// question of the planning output.
message SecondOpinion {
  // Answer is the answer to one question.
  message Answer {
    // The id of the question in the planning output.
    string question_id = 1;
    // The answer.
    string answer = 2;
  }

  // The answers, one for each question.
  repeated Answer answers = 1;
}

// ImplementationOutput is the structured output of the implementing stage
// of the first workflow (decision 0171). The code change is the workspace
// itself, whose tree the runner computes (decision 0160), so the output
// only describes it.
message ImplementationOutput {
  // What the change does and why, as Markdown, for the people who review
  // it.
  string summary = 1;
}

// CheckingOutput is the structured output of the checking stage of the
// first workflow (decision 0171): the facts that VERIFY, the path checks,
// the metrics and DCO produce, which the scope, budgets and DCO gates and
// the merge read.
message CheckingOutput {
  // verify.passed.
  pumi.facts.v1.VerifyPassed verify_passed = 1;
  // paths.protected.
  pumi.facts.v1.PathsProtected paths_protected = 2;
  // paths.outside.
  pumi.facts.v1.PathsOutside paths_outside = 3;
  // budgets.breached.
  pumi.facts.v1.BudgetsBreached budgets_breached = 4;
  // dco.signed.
  pumi.facts.v1.DcoSigned dco_signed = 5;
}

// SpecCheckOutput is the structured output of the spec check of the first
// workflow (decisions 0277 and 0279): spec.valid and the narratives of the
// plan's change and of the capabilities it touches, which the kernel adds
// to the tasks of the second opinion, plan review and the conformance
// audit. Its spec_valid is the spec.valid fact, which the state reported as
// its whole output before (decision 0272). The check's findings go to its
// log, not here (decision 0277).
message SpecCheckOutput {
  // spec.valid.
  pumi.facts.v1.SpecValid spec_valid = 1;
  // The narrative of the plan's change (decision 0271).
  string change_narrative = 2;
  // The narratives of the capabilities that the change touches, by the
  // capability's name.
  map<string, string> capability_narratives = 3;
}

// CoverageReport is the coverage of the requirements of the plan's change
// (decision 0280), which the kernel adds to the task of the conformance
// audit. It is not a fact.
message CoverageReport {
  // Requirement is one requirement that the change adds or modifies.
  message Requirement {
    // The requirement's ID, such as BLS-001 (decision 0274).
    string id = 1;
    // The test files, relative to the root of the repository, whose
    // Verifies: line names the ID.
    repeated string test_files = 2;
    // The reason the plan gives for having no test for the requirement;
    // empty when it gives none.
    string no_test_reason = 3;
  }

  // The requirements that the change adds or modifies, each once. A
  // removed or only renamed requirement is not listed.
  repeated Requirement requirements = 1;
}
