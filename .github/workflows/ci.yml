# CI for the core repository. The workflow only sets up and calls make; the
# pass-or-fail logic is in the repository (decision 0084). Every check job runs
# in the devcontainer image by digest (decisions 0089 and 0113).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the GitHub container registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Find or build the image
        id: image
        run: |
          image=$(make --no-print-directory image)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"

  test:
    name: test
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      - name: Keep the coverage profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  lint:
    name: lint
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint

  dco:
    name: dco
    if: ${{ github.event_name == 'pull_request' }}
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check reads every commit between the base and the head.
          fetch-depth: 0
      # The workspace belongs to another user than the container's, and git
      # refuses to read a repository owned by another user unless it is
      # marked safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make dco RANGE="$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  spdx:
    name: spdx
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit. The check compares it
          # with its first parent, so it needs two commits.
          fetch-depth: 2
      # The workspace belongs to another user than the container's, and git
      # refuses to read a repository owned by another user unless it is
      # marked safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # A pull request's files that are added or changed (decision 0068). The
      # first parent of the merge commit is the commit that the pull request
      # merges into.
      - if: ${{ github.event_name == 'pull_request' }}
        run: make spdx BASE=HEAD^1
      # Every file, after a merge to main.
      - if: ${{ github.event_name != 'pull_request' }}
        run: make spdx

  imports:
    name: imports
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make imports

  license:
    name: license
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make license
